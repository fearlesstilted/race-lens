services:
  api:
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/fixtures:/data/fixtures
  frontend:
    image: node:22-slim
    working_dir: /app
    depends_on:
      - api
    environment:
      RACELENS_API_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

volumes:
  frontend_node_modules:
