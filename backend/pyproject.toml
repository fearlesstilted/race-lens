[project]
name = "racelens"
version = "0.1.0"
description = "Open-source motorsport replay and intelligence engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
fastf1 = ["fastf1>=3.3"]
api = ["fastapi>=0.116,<0.117", "uvicorn>=0.29"]
whisper = ["faster-whisper>=1.0"]
recorder = ["fastf1==3.8.3", "faster-whisper==1.2.1"]
dev = ["pytest>=8,<10", "ruff>=0.4", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["racelens*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
